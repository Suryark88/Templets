<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clean Fullscreen Network</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #02060d; }
    .network-wrap {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background:
        radial-gradient(circle at 20% 18%, rgba(0, 105, 255, 0.10), transparent 34%),
        radial-gradient(circle at 82% 65%, rgba(0, 174, 255, 0.08), transparent 36%),
        linear-gradient(135deg, #04101f 0%, #02070f 48%, #01040a 100%);
    }
    canvas { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <div class="network-wrap"><canvas id="network"></canvas></div>

  <script>
    const canvas = document.getElementById('network');
    const ctx = canvas.getContext('2d');

    let W = 0, H = 0, DPR = 1;
    const mouse = { x: null, y: null, radius: 210 };

    const CONFIG = {
      density: 1 / 9500,
      minNodes: 120,
      maxNodes: 260,
      speed: 0.11,
      connectDistance: 180,
      maxConnections: 7,
      isolatedGrace: 0 // only connected nodes are drawn
    };

    const nodes = [];

    const rand = (min, max) => Math.random() * (max - min) + min;

    class Node {
      constructor() {
        this.x = Math.random() * W;
        this.y = Math.random() * H;
        this.vx = rand(-CONFIG.speed, CONFIG.speed);
        this.vy = rand(-CONFIG.speed, CONFIG.speed);
        this.r = rand(1.0, 2.0);
        this.phase = Math.random() * Math.PI * 2;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.phase += 0.02;

        if (mouse.x !== null) {
          const dx = mouse.x - this.x;
          const dy = mouse.y - this.y;
          const d2 = dx * dx + dy * dy;
          if (d2 > 0 && d2 < mouse.radius * mouse.radius) {
            const d = Math.sqrt(d2);
            const force = (mouse.radius - d) / mouse.radius;
            this.x -= (dx / d) * force * 0.75;
            this.y -= (dy / d) * force * 0.75;
          }
        }

        const m = 12;
        if (this.x < -m) this.x = W + m;
        if (this.x > W + m) this.x = -m;
        if (this.y < -m) this.y = H + m;
        if (this.y > H + m) this.y = -m;
      }

      draw() {
        const pulse = 0.95 + Math.sin(this.phase) * 0.08;
        ctx.save();
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r * 4.0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(38, 171, 255, 0.08)';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r * pulse, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(220, 248, 255, 0.98)';
        ctx.shadowBlur = 13;
        ctx.shadowColor = 'rgba(50, 183, 255, 1)';
        ctx.fill();
        ctx.restore();
      }
    }

    function resize() {
      DPR = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = Math.round(W * DPR);
      canvas.height = Math.round(H * DPR);
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      createNodes();
    }

    function createNodes() {
      nodes.length = 0;
      const count = Math.max(
        CONFIG.minNodes,
        Math.min(CONFIG.maxNodes, Math.round(W * H * CONFIG.density))
      );
      for (let i = 0; i < count; i++) nodes.push(new Node());
    }

    function buildConnections() {
      const links = [];
      const counts = new Array(nodes.length).fill(0);
      const maxD2 = CONFIG.connectDistance * CONFIG.connectDistance;

      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          if (counts[i] >= CONFIG.maxConnections || counts[j] >= CONFIG.maxConnections) continue;

          const dx = nodes[i].x - nodes[j].x;
          const dy = nodes[i].y - nodes[j].y;
          const d2 = dx * dx + dy * dy;

          if (d2 < maxD2) {
            const d = Math.sqrt(d2);
            const opacity = 1 - d / CONFIG.connectDistance;
            links.push({ i, j, opacity });
            counts[i]++;
            counts[j]++;
          }
        }
      }

      return { links, counts };
    }

    function drawConnections(links) {
      ctx.lineCap = 'round';
      for (const link of links) {
        const a = nodes[link.i];
        const b = nodes[link.j];
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.strokeStyle = `rgba(0, 148, 255, ${0.18 + link.opacity * 0.42})`;
        ctx.lineWidth = 0.8;
        ctx.stroke();
      }
    }

    function animate() {
      ctx.clearRect(0, 0, W, H);

      for (const n of nodes) n.update();

      const { links, counts } = buildConnections();
      drawConnections(links);

      // Critical: draw ONLY nodes that are actually connected to the network.
      // This removes stray blinking / unaligned dots completely.
      for (let i = 0; i < nodes.length; i++) {
        if (counts[i] > CONFIG.isolatedGrace) nodes[i].draw();
      }

      requestAnimationFrame(animate);
    }

    window.addEventListener('mousemove', e => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    window.addEventListener('mouseleave', () => {
      mouse.x = null;
      mouse.y = null;
    });

    window.addEventListener('resize', resize);

    resize();
    animate();
  </script>
</body>
</html>
